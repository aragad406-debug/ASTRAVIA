{% load astravia %}{% if person.portrait and person.portrait.url and not person.portrait.is_archived %}<img class="portrait{% if size == 'small' %} portrait--round{% endif %}" src="{{ person.portrait.url }}" alt="{{ person.portrait|loc:'alt_text'|default:person.name_en }}" loading="lazy" decoding="async">{% else %}<span class="sigil{% if size %} sigil--{{ size }}{% endif %}" style="--c: {{ person.signature_color|default:'#63E6FF' }}" data-initials="{{ person.name_en|initials }}" aria-hidden="true"></span>{% endif %}
