{% with w=field.field.widget.input_type %}
<div class="field{% if field.field.widget.attrs.rows or field.field.widget.allow_multiple_selected or 'json' in field.field.widget.attrs.class|default:'' %} field--wide{% endif %}{% if w == 'checkbox' %} check{% endif %}">
  {% if w == "checkbox" %}{{ field }} <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% else %}<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="muted" aria-hidden="true">*</span>{% endif %}</label>{{ field }}{% endif %}
  {% if field.help_text %}<span class="help">{{ field.help_text }}</span>{% endif %}
  {% if field.errors %}<ul class="errorlist">{% for e in field.errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
</div>
{% endwith %}
